name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:

  # ─────────────────────────────────────────────────────────────
  # Backend Tests
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthdb
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          FRONTEND_URL: http://localhost:5173
          POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/healthdb
          MONGO_URI: mongodb://localhost:27017/public_health_chatbot
          REDIS_URL: redis://localhost:6379
        run: npm test -- --forceExit


  # ─────────────────────────────────────────────────────────────
  # Frontend Build
  # ─────────────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5004/api
        run: npm run build


  # ─────────────────────────────────────────────────────────────
  # AI Service Tests
  # ─────────────────────────────────────────────────────────────
  ai-service-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI service tests
        env:
          JWT_SECRET: ci-test-secret
          AI_API_KEY: test-key
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
          NODE_URL: http://localhost:5004
          APP_ENV: test
        run: pytest tests/ -v --tb=short


  # ─────────────────────────────────────────────────────────────
  # Docker Build Validation
  # ─────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build ./backend -t health-backend:ci

      - name: Build frontend Docker image
        run: docker build ./frontend -t health-frontend:ci

      - name: Build AI service Docker image
        run: docker build ./ai-service -t health-ai:ci


  # ─────────────────────────────────────────────────────────────
  # Playwright E2E Tests
  # Disabled temporarily until selectors are stabilized
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    if: false

    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-tests

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthdb
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Seed database
        working-directory: backend
        env:
          POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/healthdb
          MONGO_URI: mongodb://localhost:27017/public_health_chatbot
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
        run: node src/utils/seedData.js || true

      - name: Start backend
        working-directory: backend
        env:
          POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/healthdb
          MONGO_URI: mongodb://localhost:27017/public_health_chatbot
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          FRONTEND_URL: http://localhost:5173
          PORT: 5004
        run: npm start &

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5004/api
        run: npm run dev &

      - name: Wait for services
        run: |
          npx wait-on http://localhost:5004/api/health http://localhost:5173 --timeout 30000

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run test:e2e


  # ─────────────────────────────────────────────────────────────
  # Agent Evaluation
  # ─────────────────────────────────────────────────────────────
  agent-eval:
    runs-on: ubuntu-latest

    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent evaluation
        env:
          JWT_SECRET: ci-test-secret
          AI_API_KEY: test-key
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
          NODE_URL: http://localhost:5004
          APP_ENV: test
        run: pytest eval/test_eval.py -v --tb=short