services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: health-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: public_health

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d public_health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: health-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # ============================================================
  # Qdrant Vector Database
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.9.3
    container_name: health-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s


  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build:
      context: ./backend

    container_name: health-backend

    profiles:
      - app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      PORT: 5004
      NODE_ENV: production

      DB_STARTUP_RETRIES: 15
      DB_STARTUP_DELAY_MS: 4000

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m

      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/public_health

      MONGO_URI: ${MONGO_URI}

      REDIS_URL: redis://redis:6379

      AI_PROVIDER: openai
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: gpt-4o-mini

      AI_SERVICE_URL: http://ai-service:8000

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

    ports:
      - "5004:5004"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5004/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ============================================================
  # AI Service
  # ============================================================
  ai-service:
    build:
      context: ./ai-service

    container_name: health-ai

    profiles:
      - app

    depends_on:
      qdrant:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      APP_ENV: production

      JWT_SECRET: ${JWT_SECRET}

      AI_PROVIDER: openai
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: gpt-4o-mini

      QDRANT_URL: http://qdrant:6333

      REDIS_URL: redis://redis:6379

      EMBEDDING_MODEL: all-MiniLM-L6-v2

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend

    container_name: health-frontend

    profiles:
      - app

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:80"

    restart: unless-stopped


# ============================================================
# Persistent Volumes
# ============================================================
volumes:
  postgres_data:
  redis_data:
  qdrant_data: