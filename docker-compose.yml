services:
  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: health-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: public_health
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d public_health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: health-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: health-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.9.3
    container_name: health-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:6333/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Application services ────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: health-backend
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5004
      NODE_ENV: production
      DB_STARTUP_RETRIES: 15
      DB_STARTUP_DELAY_MS: 4000
      JWT_SECRET: change_me_strong_secret
      JWT_EXPIRES_IN: 15m
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/public_health
      MONGO_URI: mongodb://mongodb:27017/public_health_chatbot
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: openai
      AI_API_KEY: replace_with_api_key
      AI_MODEL: gpt-4o-mini
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:5173
    ports:
      - '5004:5004'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:5004/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    build:
      context: ./ai-service
    container_name: health-ai
    profiles: ['app']
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      JWT_SECRET: change_me_strong_secret
      AI_PROVIDER: openai
      AI_API_KEY: replace_with_api_key
      AI_MODEL: gpt-4o-mini
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    ports:
      - '8000:8000'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: health-frontend
    profiles: ['app']
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '5173:80'

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  qdrant_data:
